<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Chun ❤️ Chan</title>

<style>

/* =========================
   RESET
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  background:#080308;
}

body{

  min-height:100vh;
  min-height:100svh;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  sans-serif;

  color:white;

  background:
  radial-gradient(
    circle at 50% 15%,
    #64172d 0%,
    #260914 38%,
    #080308 100%
  );

  overflow-x:hidden;
  overflow-y:auto;

  -webkit-overflow-scrolling:touch;
}


/* =========================
   LỚP TỐI
========================= */

body::before{

  content:"";

  position:fixed;

  inset:0;

  background:
  radial-gradient(
    circle at center,
    transparent 15%,
    rgba(0,0,0,.58)
  );

  pointer-events:none;

  z-index:0;
}


/* =========================
   CONTAINER
========================= */

.container{

  min-height:100svh;

  display:flex;

  justify-content:center;
  align-items:center;

  padding:
  24px
  18px
  calc(100px + env(safe-area-inset-bottom));

  position:relative;

  z-index:2;
}


/* =========================
   CARD
========================= */

.card{

  width:min(440px,100%);

  padding:
  36px
  22px
  40px;

  text-align:center;

  border:
  1px solid
  rgba(255,255,255,.16);

  border-radius:32px;

  background:
  rgba(255,255,255,.075);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  box-shadow:
  0 25px 80px
  rgba(0,0,0,.58);
}


/* =========================
   HEART
========================= */

.heart{

  font-size:56px;

  margin-bottom:12px;

  animation:
  pulse 1.8s infinite;
}


/* =========================
   TITLE
========================= */

h1{

  font-size:42px;

  letter-spacing:2px;

  margin-bottom:8px;
}

.subtitle{

  color:#f5c8d2;

  font-size:16px;

  margin-bottom:30px;
}


/* =========================
   DATE
========================= */

.date{

  color:#dca9b5;

  font-size:13px;

  letter-spacing:2px;

  margin-bottom:16px;
}


/* =========================
   DAYS
========================= */

.days{

  font-size:54px;

  font-weight:800;

  line-height:1;

  background:
  linear-gradient(
    90deg,
    #ffffff,
    #ff9db2,
    #ffffff
  );

  -webkit-background-clip:text;

  background-clip:text;

  color:transparent;
}

.label{

  margin-top:9px;

  color:#e8bdc7;

  font-size:13px;

  letter-spacing:.5px;
}


/* =========================
   TIME
========================= */

.time{

  display:grid;

  grid-template-columns:
  repeat(4,1fr);

  gap:8px;

  margin:27px 0;
}

.box{

  padding:13px 4px;

  border-radius:17px;

  background:
  rgba(255,255,255,.08);

  border:
  1px solid
  rgba(255,255,255,.09);
}

.number{

  font-size:22px;

  font-weight:700;
}

.small{

  font-size:10px;

  color:#dca9b5;

  margin-top:4px;
}


/* =========================
   QUOTE
========================= */

.quote{

  color:#f3d9de;

  font-size:15px;

  line-height:1.7;

  margin-top:18px;
}


/* =========================
   MUSIC
========================= */

.music{

  margin-top:25px;

  padding-top:20px;

  border-top:
  1px solid
  rgba(255,255,255,.10);
}

.music-title{

  font-size:13px;

  color:#f4cbd4;

  margin-bottom:12px;

  letter-spacing:.5px;
}


/*
  YouTube player
*/

.youtube{

  width:100%;

  aspect-ratio:16 / 9;

  overflow:hidden;

  border-radius:18px;

  background:#000;

  box-shadow:
  0 12px 35px
  rgba(0,0,0,.35);
}

.youtube iframe{

  width:100%;

  height:100%;

  border:0;

  display:block;
}


/* =========================
   FOOTER
========================= */

.footer{

  margin-top:22px;

  font-size:11px;

  color:#b9828e;

  letter-spacing:2px;
}


/* =========================
   FLOATING HEARTS
========================= */

.floating{

  position:fixed;

  bottom:-40px;

  font-size:20px;

  animation:
  float 7s linear infinite;

  opacity:.7;

  z-index:1;

  pointer-events:none;
}


/* =========================
   ANIMATION
========================= */

@keyframes pulse{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.13);
  }

}

@keyframes float{

  from{

    transform:
    translateY(0)
    rotate(0deg);

    opacity:0;
  }

  15%{
    opacity:.7;
  }

  to{

    transform:
    translateY(-110vh)
    rotate(360deg);

    opacity:0;
  }

}


/* =========================
   IPHONE
========================= */

@media(max-width:480px){

  .container{

    align-items:flex-start;

    padding-top:18px;

    padding-bottom:
    calc(
      100px +
      env(safe-area-inset-bottom)
    );
  }

  .card{

    padding:
    30px
    19px
    36px;

    border-radius:30px;
  }

  .heart{

    font-size:50px;
  }

  h1{

    font-size:37px;
  }

  .days{

    font-size:49px;
  }

  .time{

    gap:6px;
  }

  .box{

    padding:11px 3px;
  }

  .number{

    font-size:20px;
  }

}


/* =========================
   IPHONE MÀN HÌNH THẤP
========================= */

@media(max-width:480px) and (max-height:700px){

  .card{

    padding-top:25px;
  }

  .heart{

    font-size:44px;

    margin-bottom:7px;
  }

  h1{

    font-size:33px;
  }

  .subtitle{

    margin-bottom:22px;
  }

  .time{

    margin:20px 0;
  }

}

</style>

</head>


<body>


<!-- =========================
     MAIN
========================= -->

<div class="container">

<div class="card">


  <!-- HEART -->

  <div class="heart">
    ❤️
  </div>


  <!-- TITLE -->

  <h1>
    Chun ❤️ Chan
  </h1>

  <div class="subtitle">
    Câu chuyện của chúng ta
  </div>


  <!-- DATE -->

  <div class="date">
    BẮT ĐẦU TỪ 05 • 12 • 2022
  </div>


  <!-- DAYS -->

  <div
  class="days"
  id="days">
    0
  </div>

  <div class="label">
    NGÀY BÊN NHAU
  </div>


  <!-- TIME -->

  <div class="time">


    <div class="box">

      <div
      class="number"
      id="years">
        0
      </div>

      <div class="small">
        NĂM
      </div>

    </div>


    <div class="box">

      <div
      class="number"
      id="months">
        0
      </div>

      <div class="small">
        THÁNG
      </div>

    </div>


    <div class="box">

      <div
      class="number"
      id="hours">
        0
      </div>

      <div class="small">
        GIỜ
      </div>

    </div>


    <div class="box">

      <div
      class="number"
      id="minutes">
        0
      </div>

      <div class="small">
        PHÚT
      </div>

    </div>


  </div>


  <!-- QUOTE -->

  <div class="quote">

    “Mỗi ngày bên em đều là một ngày đáng nhớ.
    Và anh muốn câu chuyện này kéo dài mãi mãi.” ❤️

  </div>


  <!-- =========================
       YOUTUBE MUSIC
  ========================== -->

  <div class="music">

    <div class="music-title">
      🎵 Bài hát của chúng ta
    </div>


    <div class="youtube">

      <iframe

        src="https://www.youtube.com/embed/QCr4Wf_eJHo?rel=0"

        title="Chun ❤️ Chan - Đến Khi Nào"

        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share
        "

        allowfullscreen>

      </iframe>

    </div>

  </div>


  <!-- FOOTER -->

  <div class="footer">
    CHUN ❤️ CHAN • MÃI MÃI
  </div>


</div>

</div>


<!-- =========================
     FLOATING HEARTS
========================= -->

<script>


/* =========================
   LOVE TIMER
========================= */

const start =
new Date(
  2022,
  11,
  5,
  0,
  0,
  0
);


function update(){

  const now =
  new Date();


  const diff =
  now - start;


  const totalDays =
  Math.floor(
    diff /
    86400000
  );


  const totalHours =
  Math.floor(
    diff /
    3600000
  );


  const totalMinutes =
  Math.floor(
    diff /
    60000
  );


  let years =
  now.getFullYear()
  -
  start.getFullYear();


  let months =
  now.getMonth()
  -
  start.getMonth();


  if(
    now.getDate()
    <
    start.getDate()
  ){

    months--;

  }


  if(months < 0){

    years--;

    months += 12;

  }


  document
  .getElementById("days")
  .textContent =
  totalDays.toLocaleString("vi-VN");


  document
  .getElementById("years")
  .textContent =
  years;


  document
  .getElementById("months")
  .textContent =
  months;


  document
  .getElementById("hours")
  .textContent =
  totalHours % 24;


  document
  .getElementById("minutes")
  .textContent =
  totalMinutes % 60;

}


update();


setInterval(
  update,
  1000
);


/* =========================
   FLOATING HEARTS
========================= */

function heart(){

  const h =
  document.createElement("div");


  h.className =
  "floating";


  const hearts = [

    "❤️",
    "💕",
    "💗",
    "💖",
    "💘"

  ];


  h.textContent =
  hearts[
    Math.floor(
      Math.random()
      *
      hearts.length
    )
  ];


  h.style.left =
  Math.random()
  *
  100
  +
  "vw";


  h.style.animationDuration =
  (
    5
    +
    Math.random()
    *
    5
  )
  +
  "s";


  h.style.fontSize =
  (
    15
    +
    Math.random()
    *
    18
  )
  +
  "px";


  document
  .body
  .appendChild(h);


  setTimeout(
    () => h.remove(),
    10000
  );

}


setInterval(
  heart,
  700
);

</script>


</body>
</html>
