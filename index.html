<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chun ❤️ Chan</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:white;
  background:
    radial-gradient(circle at 50% 20%,#5b1428 0%,#210711 38%,#080308 100%);
  overflow:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center,transparent 20%,rgba(0,0,0,.55));
  pointer-events:none;
}

.container{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  position:relative;
  z-index:2;
}

.card{
  width:min(440px,100%);
  padding:42px 25px 35px;
  text-align:center;
  border:1px solid rgba(255,255,255,.16);
  border-radius:32px;
  background:rgba(255,255,255,.075);
  backdrop-filter:blur(18px);
  box-shadow:0 25px 80px rgba(0,0,0,.55);
}

.heart{
  font-size:58px;
  animation:pulse 1.8s infinite;
  margin-bottom:12px;
}

h1{
  font-size:42px;
  letter-spacing:2px;
  margin-bottom:10px;
}

.subtitle{
  color:#f6cbd5;
  font-size:16px;
  margin-bottom:32px;
}

.date{
  font-size:14px;
  color:#dca9b5;
  margin-bottom:15px;
  letter-spacing:2px;
}

.days{
  font-size:54px;
  font-weight:800;
  line-height:1;
  background:linear-gradient(90deg,#fff,#ff9db2,#fff);
  -webkit-background-clip:text;
  color:transparent;
}

.label{
  margin-top:9px;
  color:#e8bdc7;
  font-size:14px;
}

.time{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:28px 0;
}

.box{
  padding:14px 5px;
  border-radius:17px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.09);
}

.number{
  font-size:22px;
  font-weight:700;
}

.small{
  font-size:11px;
  color:#dca9b5;
  margin-top:3px;
}

.quote{
  color:#f3d9de;
  font-size:15px;
  line-height:1.7;
  margin-top:18px;
}

.footer{
  margin-top:25px;
  font-size:12px;
  color:#b9828e;
  letter-spacing:2px;
}

.floating{
  position:fixed;
  bottom:-40px;
  font-size:20px;
  animation:float 7s linear infinite;
  opacity:.7;
  z-index:1;
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.13)}
}

@keyframes float{
  from{transform:translateY(0) rotate(0deg);opacity:0}
  15%{opacity:.7}
  to{transform:translateY(-110vh) rotate(360deg);opacity:0}
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="heart">❤️</div>

    <h1>Chun ❤️ Chan</h1>

    <div class="subtitle">
      Câu chuyện của chúng ta
    </div>

    <div class="date">
      BẮT ĐẦU TỪ 05 • 12 • 2022
    </div>

    <div class="days" id="days">0</div>
    <div class="label">NGÀY BÊN NHAU</div>

    <div class="time">
      <div class="box">
        <div class="number" id="years">0</div>
        <div class="small">NĂM</div>
      </div>

      <div class="box">
        <div class="number" id="months">0</div>
        <div class="small">THÁNG</div>
      </div>

      <div class="box">
        <div class="number" id="hours">0</div>
        <div class="small">GIỜ</div>
      </div>

      <div class="box">
        <div class="number" id="minutes">0</div>
        <div class="small">PHÚT</div>
      </div>
    </div>

    <div class="quote">
      “Mỗi ngày bên em đều là một ngày đáng nhớ.
      Và anh muốn câu chuyện này kéo dài mãi mãi.” ❤️
    </div>

    <div class="footer">
      CHUN ❤️ CHAN • MÃI MÃI
    </div>

  </div>
</div>

<script>
const start = new Date(2022,11,5,0,0,0);

function update(){
  const now = new Date();
  const diff = now - start;

  const totalDays = Math.floor(diff / 86400000);
  const totalHours = Math.floor(diff / 3600000);
  const totalMinutes = Math.floor(diff / 60000);

  let years = now.getFullYear() - start.getFullYear();
  let months = now.getMonth() - start.getMonth();

  if(now.getDate() < start.getDate()) months--;

  if(months < 0){
    years--;
    months += 12;
  }

  document.getElementById("days").textContent =
    totalDays.toLocaleString("vi-VN");

  document.getElementById("years").textContent = years;
  document.getElementById("months").textContent = months;
  document.getElementById("hours").textContent =
    totalHours % 24;
  document.getElementById("minutes").textContent =
    totalMinutes % 60;
}

update();
setInterval(update,1000);

function heart(){
  const h=document.createElement("div");
  h.className="floating";
  h.textContent=["❤️","💕","💗","💖","💘"][Math.floor(Math.random()*5)];
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(5+Math.random()*5)+"s";
  h.style.fontSize=(15+Math.random()*18)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),10000);
}

setInterval(heart,700);
</script>

</body>
</html>
